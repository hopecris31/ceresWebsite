<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceres Enterprises - News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/main.js" defer></script>

    <style>
        /* ── PAGE HEADER ── */
        .page-header {
            padding-top: 9rem;
            padding-bottom: 2rem;
            text-align: center;
            background: #111827;
        }

        .page-eyebrow {
            font-family: 'Public Sans', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #d4af64;
            margin-bottom: 1.25rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.2s;
        }

        .page-title {
            font-family: 'Playfair Display SC', serif;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: #ffffff;
            margin: 0;
            opacity: 0;
            animation: fadeInUp 0.9s ease forwards 0.4s;
        }

        .hero-line {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #eae5c8, transparent);
            margin: 2rem auto 0;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── NEWS LAYOUT ── */
        .news-section {
            background: #111827;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .news-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── FEATURED ARTICLE (top, full width) ── */
        .featured-article {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 0;
            margin-bottom: 4px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .featured-article.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .featured-article:hover .article-image img {
            transform: scale(1.04);
        }

        .featured-article:hover .article-arrow {
            gap: 1.25rem;
        }

        .featured-article:hover .article-arrow::after {
            transform: translateX(4px);
        }

        .article-image {
            position: relative;
            overflow: hidden;
            min-height: 460px;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: brightness(0.85);
        }

        .article-image-placeholder {
            width: 100%;
            height: 100%;
            min-height: 460px;
            background: linear-gradient(135deg, #1a2535 0%, #0e1420 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .placeholder-icon {
            opacity: 0.12;
        }

        .article-info {
            background: #161f2e;
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }

        .article-info::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border-top: 1px solid rgba(212, 175, 100, 0.25);
            border-left: 1px solid rgba(212, 175, 100, 0.25);
        }

        .article-info::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            border-bottom: 1px solid rgba(212, 175, 100, 0.25);
            border-right: 1px solid rgba(212, 175, 100, 0.25);
        }

        .article-date {
            font-family: 'Public Sans', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 1rem;
        }

        .article-headline {
            font-family: 'Playfair Display SC', serif;
            font-size: clamp(1.2rem, 2.5vw, 1.75rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            color: #ffffff;
            line-height: 1.35;
            margin-bottom: 1.25rem;
        }

        .article-excerpt {
            font-family: 'Public Sans', sans-serif;
            font-size: 0.9rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.55);
            font-weight: 300;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .article-divider {
            width: 36px;
            height: 1px;
            background: rgba(212, 175, 100, 0.35);
            margin-bottom: 2rem;
        }

        .article-arrow {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Public Sans', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #d4af64;
            transition: gap 0.3s ease;
        }

        .article-arrow::after {
            content: '→';
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        /* ── GRID ARTICLES (3 columns below featured) ── */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }

        .grid-article {
            display: flex;
            flex-direction: column;
            background: #161f2e;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            cursor: pointer;
            text-decoration: none;
            border-top: 1px solid rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .grid-article.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .grid-article:hover .article-image img {
            transform: scale(1.05);
        }

        .grid-article:hover .article-arrow {
            gap: 1.25rem;
        }

        .grid-article:hover .article-arrow::after {
            transform: translateX(4px);
        }

        .grid-article .article-image {
            min-height: 220px;
        }

        .grid-article .article-image-placeholder {
            min-height: 220px;
        }

        .grid-article .article-info {
            padding: 2rem 2rem 2.5rem;
            flex-grow: 1;
        }

        .grid-article .article-info::before,
        .grid-article .article-info::after {
            display: none;
        }

        .grid-article .article-headline {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
        }

        /* ── SECONDARY FULL-WIDTH STRIP ── */
        .strip-article {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            margin-bottom: 4px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            cursor: pointer;
            text-decoration: none;
            background: #161f2e;
        }

        .strip-article.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .strip-article:hover .article-image img {
            transform: scale(1.05);
        }

        .strip-article:hover .article-arrow {
            gap: 1.25rem;
        }

        .strip-article:hover .article-arrow::after {
            transform: translateX(4px);
        }

        .strip-article .article-image {
            min-height: 200px;
        }

        .strip-article .article-image-placeholder {
            min-height: 200px;
        }

        .strip-article .article-info {
            padding: 2rem 2.5rem;
            justify-content: center;
        }

        .strip-article .article-info::before,
        .strip-article .article-info::after {
            display: none;
        }

        .strip-article .article-headline {
            font-size: clamp(1rem, 1.5vw, 1.3rem);
            margin-bottom: 0.75rem;
        }

        .strip-article .article-excerpt {
            margin-bottom: 1.25rem;
            -webkit-line-clamp: 2;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .featured-article,
            .strip-article {
                grid-template-columns: 1fr;
            }

            .article-image,
            .article-image-placeholder {
                min-height: 280px !important;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .article-info {
                padding: 2rem;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

<!-- ================== NAVBAR ================== -->
<div id="navbar-placeholder"></div>
<script>
    fetch('/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-placeholder').outerHTML = data;

            const navbar = document.querySelector('.navbar');
            if (navbar) {
                if (window.scrollY > 80) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');

                window.addEventListener('scroll', () => {
                    if (window.scrollY > 80) navbar.classList.add('scrolled');
                    else navbar.classList.remove('scrolled');
                });
            }
        });
</script>

<!-- ================== PAGE HEADER ================== -->
<header class="page-header">
    <p class="page-eyebrow">Latest Updates</p>
    <h1 class="page-title font-playfair-display-sc-regular">NEWS</h1>
    <div class="hero-line"></div>
</header>

<!-- ================== NEWS CONTENT ================== -->
<section class="news-section">
    <div class="news-inner" id="news-container"></div>
</section>

<!-- ================== FOOTER ================== -->
<div id="footer-placeholder"></div>
<script>
    fetch('/footer.html')
        .then(response => {
            if (!response.ok) throw new Error('Footer fetch failed: ' + response.status);
            return response.text();
        })
        .then(data => {
            const placeholder = document.getElementById('footer-placeholder');
            placeholder.insertAdjacentHTML('beforebegin', data);
            placeholder.remove();
            const yearEl = document.getElementById('footer-year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        })
        .catch(err => console.error(err));
</script>

<!-- ================== ARTICLES DATA & RENDERER ================== -->
<script>
    // ----------------------------------------------------------------
    // ARTICLES LIST — edit this array to update the news page.
    // Each sublist: [title, tag, imagePath, date, link, description]
    // ----------------------------------------------------------------
    const articles = [
        [
            "Hotel planned for historic grain mill in Flats",
            "",
            "/images/news_images/historic_grain_mill_flats.png",
            "December 2025",
            "https://neo-trans.blog/2025/12/02/hotel-planned-for-historic-grain-mill-in-flats/",
            "A 19th-century flour mill and its towering concrete grain silos in Cleveland's Flats will be transformed into a $61.6 million hotel project"
        ],
        [
            "Cleveland Metroparks seeks partnership with hotel developer for Columbus Peninsula project",
            "",
            "/images/news_images/ideastream_mill.png",
            "August 2025",
            "https://www.ideastream.org/community/2025-08-14/cleveland-metroparks-seeks-partnership-with-hotel-developer-for-columbus-peninsula-project",
            "Cleveland Metroparks is seeking a partnership with Ceres + LaPine Development to redevelop 15 historic parcels including grain silos on the Columbus Road Peninsula along the Cuyahoga River, pending approval of historic preservation tax credits"
        ],
        [
            "NASA history lives on: Cleveland’s Orbit Hotel and Centaur Apartments thrive | Mission Possible",
            "",
            "/images/news_images/mission_possible.png",
            "July 2025",
            "https://www.wkyc.com/article/money/economy/mission-possible/nasa-glenn-history-cleveland-orbit-hotel-centaur-apartments-mission-possible/95-ec66be5d-cc7e-4d9a-afb6-cd3bd5131c9f",
            "Two 1960s NASA office buildings in Fairview Park have been converted into the Orbit Hotel and Centaur Apartments, preserving Cleveland's space-age history"
        ],
        [
            "New hotels, restaurants coming to land near NASA",
            "",
            "/images/news_images/voyager_park_announcement.png",
            "November 2024",
            "https://www.cleveland19.com/2024/11/26/new-hotels-restaurants-coming-land-near-nasa/",
            "Thought for 2sCleveland City Council approved the sale of 10 acres near NASA Glenn Research Center for a $60 million development called Voyager Park, which will include two hotels and restaurants"
        ],
        [
            "Wyndham signs multi-hotel agreement with Ceres",
            "",
            "/images/news_images/wyndham_noblesville_mockup.png",
            "December 2021",
            "https://hotelbusiness.com/wyndham-signs-multi-hotel-agreement-with-ceres/",
            "Wyndham Hotels & Resorts has partnered with Ceres Development to convert and rebrand three hotels as part of the company's conversion growth strategy"
        ],
        [
            "NASA buildings transition from ‘space race’ to luxury space in Fairview Park",
            "",
            "/images/news_images/centaur_news.png",
            "May 2021",
            "https://www.cleveland19.com/2021/05/24/nasa-buildings-transition-space-race-luxury-space-fairview-park/",
            "The Centaur pays homage to NASA’s Centaur Rocket Program"
        ],
        [
            "David Crisafi of Ceres Enterprises excited to redevelop former NASA buildings in Cleveland",
            "",
            "/images/news_images/bizJournals.png",
            "November 2020",
            "https://www.bizjournals.com/cleveland/news/2020/11/17/hotel-developer-excited-by-reusing-nasa-buildings.html",
            "Ceres Enterprises is redeveloping two former NASA Glenn Research Center buildings in Fairview Park into a 59-room Trademark Collection by Wyndham hotel"
        ],
    ];

    // ----------------------------------------------------------------
    // HELPERS
    // ----------------------------------------------------------------
    const PLACEHOLDER_SVG_LG = `
        <svg class="placeholder-icon" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
        </svg>`;

    const PLACEHOLDER_SVG_SM = `
        <svg class="placeholder-icon" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
        </svg>`;

    function imagePane(imagePath, placeholderSvg) {
        const inner = imagePath
            ? `<img src="${imagePath}" alt="">`
            : `<div class="article-image-placeholder">${placeholderSvg}</div>`;
        return `<div class="article-image">${inner}</div>`;
    }

    // ----------------------------------------------------------------
    // CARD BUILDERS
    // ----------------------------------------------------------------
    function buildFeatured([title, tag, img, date, link, desc]) {
        return `
        <a href="${link}" class="featured-article" target="_blank" rel="noopener">
            ${imagePane(img, PLACEHOLDER_SVG_LG)}
            <div class="article-info">
                <p class="article-date">${date}</p>
                <h2 class="article-headline font-playfair-display-sc-regular">${title}</h2>
                <div class="article-divider"></div>
                <p class="article-excerpt">${desc}</p>
                <span class="article-arrow">Read Article</span>
            </div>
        </a>`;
    }

    function buildGrid([title, tag, img, date, link, desc]) {
        return `
        <a href="${link}" class="grid-article" target="_blank" rel="noopener">
            ${imagePane(img, PLACEHOLDER_SVG_SM)}
            <div class="article-info">
                <p class="article-date">${date}</p>
                <h3 class="article-headline font-playfair-display-sc-regular">${title}</h3>
                <div class="article-divider"></div>
                <p class="article-excerpt">${desc}</p>
                <span class="article-arrow">Read Article</span>
            </div>
        </a>`;
    }

    function buildStrip([title, tag, img, date, link, desc]) {
        return `
        <a href="${link}" class="strip-article" target="_blank" rel="noopener">
            ${imagePane(img, PLACEHOLDER_SVG_SM)}
            <div class="article-info">
                <p class="article-date">${date}</p>
                <h3 class="article-headline font-playfair-display-sc-regular">${title}</h3>
                <p class="article-excerpt">${desc}</p>
                <span class="article-arrow">Read Article</span>
            </div>
        </a>`;
    }

    // ----------------------------------------------------------------
    // RENDER — first article as featured, rest as strips
    // ----------------------------------------------------------------
    function renderNews() {
        const container = document.getElementById('news-container');
        let html = '';

        if (articles.length === 0) return;

        // Featured (first article)
        html += buildFeatured(articles[0]);

        // Strips (all remaining articles)
        articles.slice(1).forEach(a => { html += buildStrip(a); });

        container.innerHTML = html;

        // Scroll reveal
        const revealEls = container.querySelectorAll('.featured-article, .grid-article, .strip-article');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => entry.target.classList.add('visible'), i * 80);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

        revealEls.forEach(el => observer.observe(el));
    }

    renderNews();
</script>

</body>
</html>
