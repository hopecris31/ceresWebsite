<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceres Enterprises - Home</title>
    <link href="/css/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/main.js" defer></script>
</head>
<body class="bg-gray-800 text-white">

<!-- ================== FLOATING NAVBAR ================== -->
<div id="navbar-placeholder"></div>

<script>
    fetch('/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-placeholder').outerHTML = data;
        });
</script>

<!-- ================== FULL-SCREEN SLIDER ================== -->
<section class="relative h-screen w-full overflow-hidden">
    <!-- Hero Text (Centered) -->
    <div class="absolute inset-0 flex items-center justify-center z-10">
        <h1 class="text-6xl md:text-8xl font-bold text-white drop-shadow-2xl tracking-wide">
            CONTACT
        </h1>
    </div>
</section>

<script>
    // Keep navbar perfectly consistent across pages
    document.addEventListener('DOMContentLoaded', () => {
        const navbar = document.querySelector('.navbar');

        // Force correct state immediately on page load
        if (window.scrollY <= 80) {
            navbar.classList.remove('scrolled');
        } else {
            navbar.classList.add('scrolled');
        }

        // Then listen for scroll as usual
        window.addEventListener('scroll', () => {
            if (window.scrollY > 80) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    });
</script>

</body>
</html>
