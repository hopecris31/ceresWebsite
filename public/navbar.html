<!-- Floating Navbar - Shared across all pages -->
<nav class="navbar" id="navbar">
    <div class="logo-wrapper flex items-center">
        <a href="/" class="flex items-center">
            <!-- Transparent logo (visible when NOT scrolled) -->
            <img src="/images/ceresTransparent.png" alt="Ceres Logo" class="logo logo-transparent">
            <!-- White logo (visible when scrolled) -->
            <img src="/images/ceresWhitescale.png" alt="Ceres Logo" class="logo logo-white white-svg">
        </a>
    </div>
    <button class="hamburger md:hidden" id="hamburger" aria-label="Toggle menu">☰</button>
    <div class="menu-wrapper hidden md:flex">
        <a href="/about.html" class="nav-item">ABOUT</a>
        <a href="/services.html" class="nav-item">SERVICES</a>
        <a href="/properties.html" class="nav-item">PROPERTIES</a>
        <a href="/news.html" class="nav-item">NEWS</a>
        <a href="/gallery.html" class="nav-item">GALLERY</a>
        <a href="/contact.html" class="nav-item">CONTACT</a>
    </div>
    <div id="mobile-menu" class="mobile-menu hidden">
        <div class="flex flex-col space-y-6 text-center">
            <a href="/about.html" class="nav-item text-2xl">ABOUT</a>
            <a href="/services.html" class="nav-item text-2xl">SERVICES</a>
            <a href="/properties.html" class="nav-item text-2xl">PROPERTIES</a>
            <a href="/news.html" class="nav-item text-2xl">NEWS</a>
            <a href="/gallery.html" class="nav-item text-2xl">GALLERY</a>
            <a href="/contact.html" class="nav-item text-2xl">CONTACT</a>
        </div>
    </div>
</nav>

<script>
    // Navbar scroll behavior for regular pages (non-snap-container)
    setTimeout(function() {
        const navbar = document.querySelector('.navbar');
        const scrollContainer = document.getElementById('scroll-container');

        // Only run if there's no snap-container (index page handles its own scroll)
        if (navbar && !scrollContainer) {
            function updateNavbar() {
                if (window.scrollY > 80) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            }

            updateNavbar();
            window.addEventListener('scroll', updateNavbar);
        }
    }, 10);

    // Mobile menu toggle
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');

    if (hamburger && mobileMenu) {
        hamburger.addEventListener('click', function() {
            mobileMenu.classList.toggle('hidden');

            // Toggle hamburger icon between ☰ and ✕
            if (mobileMenu.classList.contains('hidden')) {
                hamburger.textContent = '☰';
            } else {
                hamburger.textContent = '✕';
            }
        });

        // Close mobile menu when clicking a link
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', function() {
                mobileMenu.classList.add('hidden');
                hamburger.textContent = '☰';
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', function(e) {
            if (!hamburger.contains(e.target) && !mobileMenu.contains(e.target)) {
                mobileMenu.classList.add('hidden');
                hamburger.textContent = '☰';
            }
        });
    }
</script>
