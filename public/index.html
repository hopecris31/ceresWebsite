<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceres Enterprises - Home</title>

    <!-- Tailwind CSS -->
    <link href="/css/output.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda+SC:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Myeongjo&family=Urbanist:ital,wght@0,100..900;1,100..900&family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/main.js" defer></script>

    <style>
        /* Slider */
        .slide {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slide.active {
            opacity: 1;
        }

        /* Scroll Snap */
        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }
        .snap-section {
            scroll-snap-align: start;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-gray-800 text-white overflow-x-hidden">
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.querySelector('.hamburger');
        const mobileMenu = document.getElementById('mobile-menu');

        if (hamburger && mobileMenu) {
            hamburger.addEventListener('click', () => {
                mobileMenu.classList.toggle('show');
                // Optional: toggle hamburger icon to X
                hamburger.textContent = mobileMenu.classList.contains('show') ? '✕' : '☰';
            });

            // Close menu when clicking a link
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('show');
                    hamburger.textContent = '☰';
                });
            });
        }

        // Close menu on resize to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                mobileMenu.classList.remove('show');
                hamburger.textContent = '☰';
            }
        });
    });
</script>

<!-- Floating Navbar -->
<nav class="navbar transition-all duration-500 ease-in-out z-50 fixed top-0 left-0 right-0">
    <!-- Logo -->
    <div class="logo-wrapper flex items-center">
        <a href="/" class="flex items-center">
            <img src="/images/ceresWhitescale.png"
                 alt="Ceres Logo"
                 class="logo transition-all duration-500 ease-in-out white-svg">
        </a>
    </div>

    <!-- Hamburger Button (visible only on mobile) -->
    <button class="hamburger md:hidden text-white text-3xl focus:outline-none">
        ☰
    </button>

    <!-- Desktop Menu (hidden on mobile) -->
    <div class="menu-wrapper hidden md:flex space-x-6 pr-36">
        <a href="/about"      class="nav-item">ABOUT</a>
        <a href="/properties" class="nav-item">PROPERTIES</a>
        <a href="/news"       class="nav-item">NEWS</a>
        <a href="/gallery"    class="nav-item">GALLERY</a>
        <a href="/contact"    class="nav-item">CONTACT</a>
    </div>

    <!-- Mobile Menu (hidden by default, toggled by hamburger) -->
    <div id="mobile-menu" class="hidden fixed top-24 left-0 right-0 bg-black/95 backdrop-blur-md py-6 px-8 md:hidden z-40">
        <div class="flex flex-col space-y-6 text-center">
            <a href="/about"      class="nav-item text-2xl">ABOUT</a>
            <a href="/properties" class="nav-item text-2xl">PROPERTIES</a>
            <a href="/news"       class="nav-item text-2xl">NEWS</a>
            <a href="/gallery"    class="nav-item text-2xl">GALLERY</a>
            <a href="/contact"    class="nav-item text-2xl">CONTACT</a>
        </div>
    </div>
</nav>

<!-- Scroll-Snap Container -->
<main class="snap-container scroll-snap-slow">

    <!-- SECTION 1: Image Slider -->
    <section class="snap-section relative h-screen w-full overflow-hidden">
        <!-- Slides -->
        <div class="slide active">
            <img src="/images/westfield.png" class="absolute inset-0 w-full h-full object-cover" alt="Westfield">
        </div>
        <div class="slide">
            <img src="/images/fairfield.png" class="absolute inset-0 w-full h-full object-cover" alt="Fairfield">
        </div>
        <div class="slide">
            <img src="/images/noblesville.png" class="absolute inset-0 w-full h-full object-cover" alt="Noblesville">
        </div>
        <div class="slide">
            <img src="/images/orbit.png" class="absolute inset-0 w-full h-full object-cover" alt="Orbit">
        </div>
        <div class="slide">
            <img src="/images/avon.png" class="absolute inset-0 w-full h-full object-cover" alt="Avon">
        </div>

        <!-- Dark overlay -->
        <div class="absolute inset-0 bg-black/50 pointer-events-none"></div>

        <div class="absolute inset-0 flex flex-col justify-center z-10 pointer-events-none">
            <div class="pl-24 md:pl-32 lg:pl-40 pr-8 md:pr-16 lg:pr-24 mx-auto">
                <!-- Top line -->
                <h4 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl tracking-wider text-white/95 font-light leading-tight font-playfair-display-sc-regular text-left">
                    Rooted in Excellence.
                </h4>
                <h4 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl tracking-wider text-white/95 font-light leading-tight mb-6 md:mb-10 font-playfair-display-sc-regular text-left">
                    Refined in Every Detail.
                </h4>

                <!-- Bottom line -->
                <h3 class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-bold tracking-[-0.02em] text-white drop-shadow-3xl leading-tight uppercase font-playfair-display-sc-regular text-left">
                    HOSPITALITY REDEFINED.
                </h3>
            </div>
        </div>
    </section>

    <!-- SECTION 2: Content -->
    <section class="snap-section flex items-center justify-center bg-gray-900 h-screen px-4 sm:px-6 md:px-8 lg:px-12">
        <div class="w-full max-w-screen-2xl text-center">
            <h4 class="text-2xl md:text-3xl lg:text-4xl xl:text-5xl font-bold mb-6 font-playfair-display-sc-regular tracking-wide leading-tight">
                Building  |  Development  |  Management
            </h4>
            <p class="text-lg md:text-xl text-gray-300 leading-relaxed font-playfair-display-sc-regular">
                An award winning hotel ownership, development, and management company.
            </p>
        </div>
    </section>

</main>

<!-- Slider & Scroll Logic -->
<script>
    const slides = document.querySelectorAll('.slide');
    let current = 0;

    function nextSlide() {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
    }

    setInterval(nextSlide, 10000);

    slides.forEach(slide => {
        const img = slide.querySelector('img');
        if (img) new Image().src = img.src;
    });

    window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 80) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY <= 80) {
            navbar.classList.remove('scrolled');
        }
    });
</script>

</body>
</html>
