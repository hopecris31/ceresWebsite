<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceres Enterprises - Home</title>
    <link href="/css/output.css" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/d1bfb85795ca505281f9cee67b285c9a?family=Avenir+LT+Pro+55+Roman" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/main.js" defer></script>

    <style>
        /* ================== NAVBAR ================== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background: transparent;
            transition: all 0.5s ease;
        }

        .nav-item {
            margin: 0 1.25rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            font-family: 'Sora', sans-serif;
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 0.75rem 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .navbar.scrolled .logo {
            height: 4rem; /* Shrink logo */
        }

        .navbar.scrolled .nav-item {
            font-size: 0.9rem;
            letter-spacing: 0.06em;
        }

        /* ================== SLIDER ================== */
        .slide {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        /* ================== SCROLL SNAP ================== */
        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }

        .snap-section {
            scroll-snap-align: start;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-gray-800 text-white overflow-x-hidden">

<!-- ================== FLOATING NAVBAR ================== -->
<nav class="navbar transition-all duration-500 ease-in-out">
    <div class="logo-wrapper">
        <a href="/" class="nav-item flex items-center">
            <img src="/images/ceresTransparent.png" alt="Ceres Logo" class="logo h-24 w-auto transition-all duration-500 ease-in-out">
        </a>
    </div>
    <div class="menu-wrapper transition-all duration-500 ease-in-out">
        <a href="/about"      class="nav-item">ABOUT</a>
        <a href="/properties" class="nav-item">PROPERTIES</a>
        <a href="/news"       class="nav-item">NEWS</a>
        <a href="/gallery"    class="nav-item">GALLERY</a>
        <a href="/contact"    class="nav-item">CONTACT</a>
    </div>
</nav>

<!-- ================== SCROLL-SNAP CONTAINER ================== -->
<main class="snap-container scroll-snap-slow">

    <!-- SECTION 1: IMAGE SLIDER -->
    <section class="snap-section relative h-screen w-full overflow-hidden">
        <!-- Slides -->
        <div class="slide active">
            <img src="/images/westfield.png" class="absolute inset-0 w-full h-full object-cover" alt="Westfield">
        </div>
        <div class="slide">
            <img src="/images/fairfield.png" class="absolute inset-0 w-full h-full object-cover" alt="Fairfield">
        </div>
        <div class="slide">
            <img src="/images/noblesville.png" class="absolute inset-0 w-full h-full object-cover" alt="Noblesville">
        </div>
        <div class="slide">
            <img src="/images/orbit.png" class="absolute inset-0 w-full h-full object-cover" alt="Orbit">
        </div>
        <div class="slide">
            <img src="/images/avon.png" class="absolute inset-0 w-full h-full object-cover" alt="Avon">
        </div>

        <!-- Dark overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/30 pointer-events-none"></div>

        <!-- Hero Text -->
        <div class="absolute inset-0 flex items-center justify-center z-10">
            <h1 class="text-7xl md:text-9xl lg:text-[10rem] font-bold text-white drop-shadow-2xl tracking-wider"
                style="font-family: 'Avenir LT Pro 55 Roman', sans-serif; letter-spacing: 0.05em;">
                CERES
            </h1>
        </div>
    </section>

    <!-- SECTION 2: CONTENT -->
    <section class="snap-section flex items-center justify-center bg-gray-900 h-screen px-8">
        <div class="max-w-4xl text-center">
            <h2 class="text-4xl md:text-6xl font-bold mb-6" style="font-family: 'Avenir LT Pro 55 Roman', sans-serif;">
                Welcome to Ceres
            </h2>
            <p class="text-lg md:text-xl text-gray-300 leading-relaxed">
                Subheading text/mission statement.
            </p>
        </div>
    </section>

</main>

<!-- ================== SLIDER SCRIPT ================== -->
<script>
    // Auto-rotate images every 10 seconds
    const slides = document.querySelectorAll('.slide');
    let current = 0;

    function nextSlide() {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
    }

    setInterval(nextSlide, 10000);

    // Preload images
    slides.forEach(slide => {
        const img = slide.querySelector('img');
        if (img) new Image().src = img.src;
    });

    // Scroll listener for navbar
    window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 80) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
</script>

</body>
</html>
