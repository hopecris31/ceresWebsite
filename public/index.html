<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceres Enterprises - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/css/output.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/main.js" defer></script>
</head>
<body class="bg-gray-800 text-white">

<!-- ================== FLOATING NAVBAR ================== -->
<nav class="navbar">
    <!-- LOGO: moved in from left -->
    <div class="logo-wrapper">
        <a href="/" class="nav-item flex items-center">
            <img src="/images/ceresTransparent.png" alt="Ceres Logo" class="h-24 w-auto">
        </a>
    </div>

    <!-- MENU: moved in from right -->
    <div class="menu-wrapper">
        <a href="/about"      class="nav-item">ABOUT</a>
        <a href="/properties" class="nav-item">PROPERTIES</a>
        <a href="/news"       class="nav-item">NEWS</a>
        <a href="/gallery"    class="nav-item">GALLERY</a>
        <a href="/contact"    class="nav-item">CONTACT</a>
    </div>
</nav>

<!-- ================== FULL-SCREEN SLIDER ================== -->
<section class="relative h-screen w-full overflow-hidden">
    <!-- Slides -->
    <div class="slide active">
        <img src="/images/westfield.png" class="absolute inset-0 w-full h-full object-cover" alt="Westfield">
    </div>
    <div class="slide">
        <img src="/images/fairfield.png" class="absolute inset-0 w-full h-full object-cover" alt="Fairfield">
    </div>
    <div class="slide">
        <img src="/images/noblesville.png" class="absolute inset-0 w-full h-full object-cover" alt="Noblesville">
    </div>
    <div class="slide">
        <img src="/images/orbit.png" class="absolute inset-0 w-full h-full object-cover" alt="Orbit">
    </div>
    <div class="slide">
        <img src="/images/avon.png" class="absolute inset-0 w-full h-full object-cover" alt="Avon">
    </div>

    <!-- Optional: Dark overlay for text readability -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/30 pointer-events-none"></div>

    <!-- Hero Text (Centered) -->
    <div class="absolute inset-0 flex items-center justify-center z-10">
        <h1 class="text-6xl md:text-8xl font-bold text-white drop-shadow-2xl tracking-wide">
            CERES
        </h1>
    </div>
</section>

<script>
    // Auto-rotate every 10 seconds with gentle fade
    const slides = document.querySelectorAll('.slide');
    let current = 0;

    function nextSlide() {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
    }

    // Start loop
    setInterval(nextSlide, 10000);

    // Optional: Preload images for smoother transition
    slides.forEach(slide => {
        const img = slide.querySelector('img');
        if (img) new Image().src = img.src;
    });
</script>
</body>
</html>
