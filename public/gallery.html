<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <style>
        /* ---------- GRID MOSAIC (desktop exact-ish layout) ---------- */
        .mosaic-grid {
            display: grid;
            gap: 16px;
            /* Desktop target: precise visual layout using named rows/columns */
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 120px; /* base row height — items will span rows to create different heights */
            align-items: stretch;
            justify-items: stretch;
        }

        .mosaic-item {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, z-index .25s;
            background: #111; /* fallback while image loads */
            display: block;
        }
        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .4s ease;
        }
        .mosaic-item:hover { transform: scale(1.02); z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .mosaic-item:hover img { transform: scale(1.08); }

        /* --- Explicit placements for the first 9 items to match screenshot --- */
        /* large left hero */
        .mosaic-item:nth-child(1) { grid-column: 1 / span 4; grid-row: 1 / span 4; }
        /* stacked right column: two small vertical tiles */
        .mosaic-item:nth-child(2) { grid-column: 5 / span 2; grid-row: 1 / span 2; }
        .mosaic-item:nth-child(3) { grid-column: 5 / span 2; grid-row: 3 / span 2; }

        /* Row below the hero — three small tiles left-to-middle */
        .mosaic-item:nth-child(4) { grid-column: 1 / span 2; grid-row: 5 / span 2; }
        .mosaic-item:nth-child(5) { grid-column: 3 / span 2; grid-row: 5 / span 2; }
        .mosaic-item:nth-child(6) { grid-column: 5 / span 2; grid-row: 5 / span 2; }

        /* wide tile next row left (example placement) */
        .mosaic-item:nth-child(7) { grid-column: 1 / span 2; grid-row: 7 / span 2; }
        /* medium tiles next to it */
        .mosaic-item:nth-child(8) { grid-column: 3 / span 2; grid-row: 7 / span 2; }
        /* big bright pool-like tile to emulate screenshot's right big tile */
        .mosaic-item:nth-child(9) { grid-column: 5 / span 2; grid-row: 7 / span 4; }

        /*
          Remaining items (10+) will auto-place beneath according to the same 6-column grid.
          If you want exact placements for all 20 images, add more nth-child rules following the pattern above.
        */

        /* ---------- RESPONSIVE FALLBACKS ---------- */
        /* Tablet: fewer columns */
        @media (max-width: 1023px) {
            .mosaic-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 160px;
            }
            /* remove forced placements so the auto-flow will arrange nicely */
            .mosaic-item:nth-child(1),
            .mosaic-item:nth-child(2),
            .mosaic-item:nth-child(3),
            .mosaic-item:nth-child(4),
            .mosaic-item:nth-child(5),
            .mosaic-item:nth-child(6),
            .mosaic-item:nth-child(7),
            .mosaic-item:nth-child(8),
            .mosaic-item:nth-child(9) {
                grid-column: auto;
                grid-row: auto;
            }
        }

        /* Mobile: single column stack */
        @media (max-width: 639px) {
            .mosaic-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }
            .mosaic-item { height: auto; }
            .mosaic-item img { height: auto; }
        }

        /* Lightbox caption style override to match earlier tailwind utility */
        #lightbox-caption { background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); padding: 12px 18px; border-radius: 10px; }

    </style>
</head>

<!-- LIGHTBOX (kept your original) -->
<div id="lightbox" class="fixed inset-0 bg-black/95 hidden flex-col items-center justify-center z-50 p-8">
    <button id="close-btn" class="absolute top-6 right-6 text-4xl text-white hover:text-gray-400 transition">×</button>
    <button id="prev-btn" class="absolute left-6 top-1/2 -translate-y-1/2 text-5xl text-white hover:text-gray-400 transition">‹</button>
    <button id="next-btn" class="absolute right-6 top-1/2 -translate-y-1/2 text-5xl text-white hover:text-gray-400 transition">›</button>
    <div class="flex flex-col items-center max-w-5xl w-full">
        <img id="lightbox-img" class="max-w-full max-h-full object-contain mb-4" src="" alt="">
        <p id="lightbox-caption" class="text-lg md:text-xl text-white/90 font-medium text-center px-4 opacity-0 transition-opacity duration-300 bg-black/60 backdrop-blur-sm py-3 rounded-lg"></p>
    </div>
</div>

<!-- SCRIPT: lightbox + auto-apply correct classes on load/resizes (keeps grid stable) -->
<script>
    (function () {
        // LIGHTBOX logic — same as your original (slightly refactored)
        const items = Array.from(document.querySelectorAll('.mosaic-item'));
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const closeBtn = document.getElementById('close-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        let currentIndex = 0;

        items.forEach((item, i) => {
            item.addEventListener('click', () => { currentIndex = i; openLightbox(); });
        });

        function openLightbox() {
            const img = items[currentIndex].querySelector('img');
            lightboxImg.src = img.src;
            lightboxCaption.textContent = img.dataset.caption || '';
            lightbox.classList.remove('hidden'); lightbox.classList.add('flex');
            document.body.style.overflow = 'hidden';
            setTimeout(() => lightboxCaption.classList.replace('opacity-0', 'opacity-100'), 100);
        }

        function closeLightbox() {
            lightbox.classList.add('hidden'); lightbox.classList.remove('flex');
            document.body.style.overflow = 'auto';
            if (lightboxCaption.classList.contains('opacity-100')) lightboxCaption.classList.replace('opacity-100','opacity-0');
        }

        function updateLightbox() {
            const img = items[currentIndex].querySelector('img');
            lightboxImg.src = img.src;
            lightboxCaption.textContent = img.dataset.caption || '';
            lightboxCaption.classList.remove('opacity-100');
            void lightboxCaption.offsetWidth;
            lightboxCaption.classList.add('opacity-100');
        }

        prevBtn.onclick = () => { currentIndex = (currentIndex - 1 + items.length) % items.length; updateLightbox(); };
        nextBtn.onclick = () => { currentIndex = (currentIndex + 1) % items.length; updateLightbox(); };
        closeBtn.onclick = closeLightbox;

        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('flex')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === 'ArrowRight') nextBtn.click();
        });

        lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

        // Helper: ensure images preserve their aspect and force reflow so grid rows align cleanly.
        function ensureImagesLoaded(container) {
            const imgs = Array.from(container.querySelectorAll('img'));
            return Promise.all(imgs.map(img => {
                if (img.complete && img.naturalWidth !== 0) return Promise.resolve();
                return new Promise(resolve => { img.onload = img.onerror = resolve; });
            }));
        }

        // On load, wait for images then (optionally) tweak grid-row spans to get tighter packing.
        (async function initMosaic() {
            const grid = document.getElementById('mosaic');
            await ensureImagesLoaded(grid);
            // If you want to further tune vertical spans (e.g., match the visual proportions more closely),
            // you can compute required rowSpan per item here and set style.gridRowEnd.
            // For now we rely on the CSS nth-child placement above which matches the screenshot pattern.
            // Force a layout reflow to make sure everything snaps in place:
            grid.style.visibility = 'visible';
            void grid.offsetWidth;
        })();

        // Reflow on resize (recalculate if you implement dynamic row spans).
        let resizeId = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeId);
            resizeId = setTimeout(() => {
                // placeholder for recalculation if desired later
            }, 150);
        });
    })();
</script>

</body>
