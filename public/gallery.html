    <style>
        /* ---------- GRID MOSAIC ---------- */
        /* Using !important to ensure these aren't overridden */
        .mosaic-grid {
            display: grid !important;
            gap: 24px !important;
            grid-template-columns: repeat(6, 1fr) !important;
            grid-auto-rows: 120px !important;
            align-items: stretch !important;
            justify-items: stretch !important;
        }

        .mosaic-item {
            overflow: hidden;
            border-radius: 0;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease;
            background: #111;
        }
        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s ease;
        }
        .mosaic-item:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 5;
        }
        .mosaic-item:hover img {
            transform: scale(1.08);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1023px) {
            .mosaic-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                grid-auto-rows: 160px !important;
            }
            .mosaic-item { grid-column: auto !important; grid-row: auto !important; }
        }

        @media (max-width: 639px) {
            .mosaic-grid {
                grid-template-columns: 1fr !important;
                grid-auto-rows: auto !important;
            }
            .mosaic-item, .mosaic-item img { height: auto; }
        }

        /* Lightbox caption */
        #lightbox-caption {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            padding: 12px 18px;
            border-radius: 0;
        }
    </style>
</head>

<!-- NAVBAR -->
<div id="navbar-placeholder"></div>

<script>
    fetch('/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-placeholder').outerHTML = data;

            // Initialize navbar scroll behavior AFTER navbar is loaded
            const navbar = document.querySelector('.navbar');
            if (navbar) {
                if (window.scrollY <= 80) {
                    navbar.classList.remove('scrolled');
                } else {
                    navbar.classList.add('scrolled');
                }

                window.addEventListener('scroll', () => {
                    if (window.scrollY > 80) {
                        navbar.classList.add('scrolled');
                    } else {
                        navbar.classList.remove('scrolled');
                    }
                });
            }
        });
</script>

<!-- LIGHTBOX -->
<div id="lightbox" class="fixed inset-0 bg-black/95 hidden flex-col items-center justify-center z-50 p-8">
    <button id="close-btn" class="absolute top-6 right-6 text-4xl text-white hover:text-gray-400 transition">×</button>
    <button id="prev-btn" class="absolute left-6 top-1/2 -translate-y-1/2 text-5xl text-white hover:text-gray-400 transition">‹</button>
    <button id="next-btn" class="absolute right-6 top-1/2 -translate-y-1/2 text-5xl text-white hover:text-gray-400 transition">›</button>
    <div class="flex flex-col items-center max-w-5xl w-full">
        <img id="lightbox-img" class="max-w-full max-h-full object-contain mb-4" src="" alt="">
        <p id="lightbox-caption" class="text-lg md:text-xl text-white/90 font-medium text-center px-4 opacity-0 transition-opacity duration-300"></p>
    </div>
</div>

<!-- SCRIPT -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const items = document.querySelectorAll('.mosaic-item');
        const grid = document.querySelector('.mosaic-grid');

        // === Auto-generate mosaic pattern ===
        let currentRow = 1;
        let rowCount = 0;

        for (let i = 0; i < items.length;) {
            const style = rowCount % 4;

            if (style === 0) {
                // Style A
                if (i + 2 >= items.length) break;
                items[i].style.gridColumn = "1 / span 4";
                items[i].style.gridRow = `${currentRow} / span 4`;
                items[i+1].style.gridColumn = "5 / span 2";
                items[i+1].style.gridRow = `${currentRow} / span 2`;
                items[i+2].style.gridColumn = "5 / span 2";
                items[i+2].style.gridRow = `${currentRow + 2} / span 2`;
                i += 3;
            } else if (style === 1) {
                // Style B
                if (i + 3 >= items.length) break;
                items[i].style.gridColumn = "1 / span 2";
                items[i].style.gridRow = `${currentRow} / span 2`;
                items[i+1].style.gridColumn = "3 / span 2";
                items[i+1].style.gridRow = `${currentRow} / span 2`;
                items[i+2].style.gridColumn = "1 / span 4";
                items[i+2].style.gridRow = `${currentRow + 2} / span 2`;
                items[i+3].style.gridColumn = "5 / span 2";
                items[i+3].style.gridRow = `${currentRow} / span 4`;
                i += 4;
            } else if (style === 2) {
                // Style C (inverse of A)
                if (i + 2 >= items.length) break;
                items[i].style.gridColumn = "3 / span 4";
                items[i].style.gridRow = `${currentRow} / span 4`;
                items[i+1].style.gridColumn = "1 / span 2";
                items[i+1].style.gridRow = `${currentRow} / span 2`;
                items[i+2].style.gridColumn = "1 / span 2";
                items[i+2].style.gridRow = `${currentRow + 2} / span 2`;
                i += 3;
            } else if (style === 3) {
                // Style D (inverse of B)
                if (i + 3 >= items.length) break;
                items[i].style.gridColumn = "1 / span 2";
                items[i].style.gridRow = `${currentRow} / span 4`;
                items[i+1].style.gridColumn = "3 / span 4";
                items[i+1].style.gridRow = `${currentRow} / span 2`;
                items[i+2].style.gridColumn = "3 / span 2";
                items[i+2].style.gridRow = `${currentRow + 2} / span 2`;
                items[i+3].style.gridColumn = "5 / span 2";
                items[i+3].style.gridRow = `${currentRow + 2} / span 2`;
                i += 4;
            }

            currentRow += 4;
            rowCount++;
        }

        // === Lightbox ===
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const closeBtn = document.getElementById('close-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        let currentIndex = 0;

        items.forEach((item, i) => {
            item.addEventListener('click', () => {
                currentIndex = i;
                openLightbox();
            });
        });

        function openLightbox() {
            const img = items[currentIndex].querySelector('img');
            lightboxImg.src = img.src;
            lightboxCaption.textContent = img.dataset.caption || '';
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            document.body.style.overflow = 'hidden';
            setTimeout(() => lightboxCaption.classList.replace('opacity-0', 'opacity-100'), 100);
        }

        function closeLightbox() {
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            document.body.style.overflow = 'auto';
            lightboxCaption.classList.replace('opacity-100', 'opacity-0');
        }

        function updateLightbox() {
            const img = items[currentIndex].querySelector('img');
            lightboxImg.src = img.src;
            lightboxCaption.textContent = img.dataset.caption || '';
        }

        prevBtn.onclick = () => { currentIndex = (currentIndex - 1 + items.length) % items.length; updateLightbox(); };
        nextBtn.onclick = () => { currentIndex = (currentIndex + 1) % items.length; updateLightbox(); };
        closeBtn.onclick = closeLightbox;
        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('flex')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === 'ArrowRight') nextBtn.click();
        });
        lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    });
</script>
